version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hirelens-postgres
    restart: always
    environment:
      POSTGRES_USER: hirelens
      POSTGRES_PASSWORD: hirelens_password
      POSTGRES_DB: hirelens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelens -d hirelens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hirelens-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirelens-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hirelens:hirelens_password@postgres:5432/hirelens_db
      SECRET_KEY: hirelens-production-secure-key-replace-in-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: /app/storage/resumes
    volumes:
      - resume_storage:/app/storage/resumes
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/ready\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirelens-celery-worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    restart: always
    environment:
      DATABASE_URL: postgresql://hirelens:hirelens_password@postgres:5432/hirelens_db
      SECRET_KEY: hirelens-production-secure-key-replace-in-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: /app/storage/resumes
    volumes:
      - resume_storage:/app/storage/resumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirelens-celery-beat
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    restart: always
    environment:
      DATABASE_URL: postgresql://hirelens:hirelens_password@postgres:5432/hirelens_db
      SECRET_KEY: hirelens-production-secure-key-replace-in-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hirelens-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  resume_storage:
